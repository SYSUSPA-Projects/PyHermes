Corr_2PCF:
   convols_data: "./output/quijote8000_snap004_rsd_sfc.pkl"
   random: "./output/random_sfc.pkl"
   window:
      type: "sphere"
      len_args:
         R: 5
   pair_window: "ring"
   sampling:
      s:
         min: 0.0
         max: 180.0
         n: 46
      mu:
         min: 0.0
         max: 1.0
         n: 51
   threads: 8
   products: "xi"
   fout_path: "./output/quijote8000_snap004_rsd_2pcf_smu_sph5_with_random.pkl"
