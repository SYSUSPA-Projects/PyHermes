# Opt-in exact spectral strategies; numerical window/sampling definitions unchanged.
Corr_2PCF:
   pair_reduction: "spectral"
   reuse_input_fields: true
   spectral_window: "auto"
   spectral_fft: "shared"
   sfc_field: "./output/quijote8000_snap004_sfc.pkl"
   random: "uniform"
   binning_window: "shell"
   sampling:
      s:
         min: 0.0
         max: 150.0
         n: 31
   products: ["dd", "dr", "rd", "xi"]
   threads: 2
   fout_path: "./output/quijote8000_snap004_2pcf_optimized_20261017.pkl"
