# Quijote halo catalogs downloaded from the official Quijote release do not
# include these .bin tables. The .bin files in this test data directory are
# derived files created by reading the original FoF group_tab catalogs with
# readfof and repacking selected halo fields into a simple float32 binary table.
# This YAML file documents that derived .bin table layout.

dtype: float32
ncols: 8
columns:
  - x
  - y
  - z
  - vx
  - vy
  - vz
  - mass
  - npart
units:
  x,y,z: Mpc/h
  vx,vy,vz: km/s; GroupVel multiplied by (1+z)
  mass: Msun/h; GroupMass multiplied by 1e10
  npart: particle count stored as float32 in the .bin table
snapnum_to_redshift:
  "000": 3.0
  "001": 2.0
  "002": 1.0
  "003": 0.5
  "004": 0.0
