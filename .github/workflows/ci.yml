name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Run Ruff
        run: |
          python -m pip install ruff
          ruff check pyhermes tests examples/scripts

  test-no-mpi:
    name: Python ${{ matrix.python-version }} without MPI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install ".[test]"
      - name: Run tests
        run: python -m pytest
      - name: Check dependencies
        run: python -m pip check

  test-mpi:
    name: MPICH two-process smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and MPICH
        run: python -m pip install ".[test,mpi]" mpich
      - name: Run two-process PyHermes MPI collective
        run: |
          mpiexec -n 2 python -c 'from pyhermes.utils.mpi_util import MPI; c=MPI.COMM_WORLD; assert c.allreduce(c.rank + 1) == 3; print(c.rank, c.size)'

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and documentation dependencies
        run: python -m pip install ".[docs]"
      - name: Build documentation with warnings as errors
        run: |
          sphinx-build -W --keep-going -b html docs docs/_build/html
          sphinx-build -W --keep-going -b html -D language=zh_CN \
            -d docs/_build/doctrees/zh_CN docs docs/_build/html/zh_CN
