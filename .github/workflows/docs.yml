name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "pyhermes/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyhermes-documentation
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: documentation
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and documentation dependencies
        run: python -m pip install ".[docs]"
      - name: Build documentation
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Configure deployment SSH key
        env:
          DOCS_SSH_KEY: ${{ secrets.DOCS_SSH_KEY }}
          DOCS_KNOWN_HOSTS: ${{ secrets.DOCS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DOCS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DOCS_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload and activate documentation release
        env:
          DOCS_HOST: ${{ secrets.DOCS_HOST }}
          DOCS_PORT: ${{ secrets.DOCS_PORT }}
          DOCS_USER: ${{ secrets.DOCS_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh -p "$DOCS_PORT" "$DOCS_USER@$DOCS_HOST" \
            "mkdir -p /srv/www/pyhermes/releases/$RELEASE_ID"
          rsync -az --delete \
            -e "ssh -p $DOCS_PORT" \
            docs/_build/html/ \
            "$DOCS_USER@$DOCS_HOST:/srv/www/pyhermes/releases/$RELEASE_ID/"
          ssh -p "$DOCS_PORT" "$DOCS_USER@$DOCS_HOST" \
            "test -f /srv/www/pyhermes/releases/$RELEASE_ID/index.html && \
             ln -sfn releases/$RELEASE_ID /srv/www/pyhermes/current.next && \
             mv -Tf /srv/www/pyhermes/current.next /srv/www/pyhermes/current"
